name: release

# Startet, wenn ein Tag wie v0.2.1 gepusht wird (oder manuell über "Run workflow").
# Die Version kommt aus dem Tag: v0.2.1 (oder v.0.2.1) baut Version 0.2.1 – die Versionsnummern
# in package.json/tauri.conf.json/Cargo.toml müssen dafür nicht vorher angepasst werden.
# Bei "Run workflow" ohne Tag wird die Version aus src-tauri/tauri.conf.json genommen.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # nötig, damit der Workflow das Release anlegen und Dateien hochladen darf

jobs:
  build:
    permissions:
      contents: write   # nötig, damit der Workflow das Release anlegen und Dateien hochladen darf
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bewusst eine ältere Ubuntu-Basis: Pakete laufen dann auch auf älteren Distributionen
          # (die eingebundene glibc-Version bestimmt die Mindestvoraussetzung).
          - platform: ubuntu-22.04        # x86_64
          - platform: ubuntu-22.04-arm    # arm64 (nur in öffentlichen Repos verfügbar, sonst Zeile entfernen)
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Set version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version=$(node scripts/set-version.mjs "${{ github.ref_name }}")
          else
            version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Version: ${version}"

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Genau der gepushte Tag (kein neuer Tag); bei "Run workflow" v<Version aus tauri.conf.json>.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          releaseName: 'Crabshell v${{ steps.version.outputs.version }}'
          releaseBody: |
            Linux packages for x86_64 and arm64. Requires the OpenSSH client (`ssh`).

            | System | File |
            | --- | --- |
            | Debian, Ubuntu, Linux Mint, Pop!_OS | `.deb` (`amd64` / `arm64`) |
            | Fedora, openSUSE, RHEL | `.rpm` (`x86_64` / `aarch64`) |
            | Arch Linux, CachyOS, EndeavourOS, Manjaro | `.pkg.tar.zst` (x86_64) |
            | Any other distribution | `.AppImage` |

            📦 Step-by-step instructions: https://github.com/alex-1987/Crabshell#installation
            ♥ Like Crabshell? Support it via [GitHub Sponsors](https://github.com/sponsors/alex-1987).
          releaseDraft: true                # erst prüfen, dann selbst veröffentlichen
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}   # z. B. v0.3.0-beta.1

  # pacman-Paket für Arch-basierte Distributionen (Arch, CachyOS, EndeavourOS, Manjaro, ...).
  # Gebaut wird in einem Arch-Container mit packaging/arch/PKGBUILD und anschließend an das
  # Release-Draft angehängt, das der build-Job angelegt hat.
  arch:
    needs: build
    if: ${{ !cancelled() }}   # auch wenn z. B. nur der arm64-Build fehlschlägt
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git nodejs npm rust webkit2gtk-4.1 gtk3 openssh github-cli

      - uses: actions/checkout@v7

      - name: Set version from tag
        if: ${{ github.ref_type == 'tag' }}
        run: node scripts/set-version.mjs "${{ github.ref_name }}"

      - name: Build pacman package
        run: |
          # makepkg läuft nicht als root.
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd packaging/arch
          sudo -H -u builder makepkg --force --noconfirm

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          gh release upload "${tag}" packaging/arch/*.pkg.tar.zst --clobber --repo "${{ github.repository }}"
