name: release

# Startet, wenn ein Tag wie v0.2.1 gepusht wird (oder manuell über "Run workflow").
# Die Version kommt aus dem Tag: v0.2.1 (oder v.0.2.1) baut Version 0.2.1 – die Versionsnummern
# in package.json/tauri.conf.json/Cargo.toml müssen dafür nicht vorher angepasst werden.
# Bei "Run workflow" ohne Tag wird die Version aus src-tauri/tauri.conf.json genommen.
#
# Ablauf: test → draft → build (Linux/Windows) → arch → publish. Die Pakete landen zuerst in einem
# Release-Entwurf; "publish" veröffentlicht ihn nur, wenn Tests und alle Builds erfolgreich waren.
# Schlägt etwas fehl, bleibt es ein Entwurf zum Prüfen.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # nötig, damit der Workflow das Release anlegen und Dateien hochladen darf

jobs:
  # Dieselben Prüfungen wie lokal (README → Checks). Ohne Erfolg wird nichts gebaut.
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Frontend (TypeScript check and build)
        run: |
          npm ci
          npm run build

      - name: Rust (format, clippy, tests)
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # Legt den Release-Entwurf genau einmal an. Früher hat jeder Build-Job selbst nach dem Release
  # gesucht; Entwürfe findet die Suche nach Tag aber nicht, also hat jeder parallele Build einen
  # eigenen Entwurf angelegt und publish nur einen davon veröffentlicht (v0.2.9 ohne x86_64/Windows).
  draft:
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - name: Create release draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            version=$(node scripts/set-version.mjs "${tag}")
          else
            version=$(node -p "require('./src-tauri/tauri.conf.json').version")
            tag="v${version}"
          fi
          # Gibt es schon ein Release (auch einen Entwurf) zu diesem Tag, z. B. bei "Re-run"?
          id=$(gh api "repos/${REPO}/releases?per_page=100" --jq ".[] | select(.tag_name == \"${tag}\") | .id" | head -n 1)
          if [ -z "${id}" ]; then
            prerelease=false
            case "${version}" in *-*) prerelease=true ;; esac   # z. B. v0.3.0-beta.1
            id=$(gh api "repos/${REPO}/releases" \
              -f tag_name="${tag}" -f target_commitish="${GITHUB_SHA}" -f name="Crabshell v${version}" \
              -F body=@.github/release-body.md -F draft=true -F prerelease="${prerelease}" --jq .id)
          fi
          echo "Release ${tag}: ${id}"
          echo "id=${id}" >> "$GITHUB_OUTPUT"

  build:
    needs: [test, draft]
    permissions:
      contents: write   # nötig, damit der Workflow das Release anlegen und Dateien hochladen darf
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bewusst eine ältere Ubuntu-Basis: Pakete laufen dann auch auf älteren Distributionen
          # (die eingebundene glibc-Version bestimmt die Mindestvoraussetzung).
          - platform: ubuntu-22.04        # x86_64
          - platform: ubuntu-22.04-arm    # arm64 (nur in öffentlichen Repos verfügbar, sonst Zeile entfernen)
          # Windows 10/11 x64: Setup-.exe (NSIS) und .msi. Nicht signiert (SmartScreen-Hinweis beim ersten Start).
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Set version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version=$(node scripts/set-version.mjs "${{ github.ref_name }}")
          else
            version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Version: ${version}"

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # MSI erlaubt nur rein numerische Versionen: bei Vorabversionen (v0.3.0-beta.1) unter Windows nur die Setup-.exe.
          args: ${{ runner.os == 'Windows' && contains(steps.version.outputs.version, '-') && '--bundles nsis' || '' }}
          # Lädt in den Entwurf, den der draft-Job angelegt hat (kein eigenes Release pro Build).
          releaseId: ${{ needs.draft.outputs.id }}

  # pacman-Paket für Arch-basierte Distributionen (Arch, CachyOS, EndeavourOS, Manjaro, ...).
  # Gebaut wird in einem Arch-Container mit packaging/arch/PKGBUILD und anschließend an das
  # Release-Entwurf angehängt, den der draft-Job angelegt hat.
  arch:
    needs: [test, draft, build]
    # Auch wenn z. B. nur der arm64-Build fehlschlägt, aber nie nach fehlgeschlagenen Tests.
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git nodejs npm rust webkit2gtk-4.1 gtk3 openssh github-cli

      - uses: actions/checkout@v7

      - name: Set version from tag
        if: ${{ github.ref_type == 'tag' }}
        run: node scripts/set-version.mjs "${{ github.ref_name }}"

      - name: Build pacman package
        run: |
          # makepkg läuft nicht als root.
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd packaging/arch
          sudo -H -u builder makepkg --force --noconfirm

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: |
          # Über die ID des Entwurfs, nicht über den Tag (Entwürfe sind per Tag nicht eindeutig).
          for file in packaging/arch/*.pkg.tar.zst; do
            name=$(basename "${file}")
            # Wie --clobber: eine gleichnamige Datei (z. B. von einem früheren Lauf) zuerst löschen.
            old=$(gh api "repos/${REPO}/releases/${RELEASE_ID}/assets?per_page=100" --jq ".[] | select(.name == \"${name}\") | .id")
            [ -n "${old}" ] && gh api -X DELETE "repos/${REPO}/releases/assets/${old}"
            gh api -X POST "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${name}" \
              -H "Content-Type: application/octet-stream" --input "${file}" --jq .browser_download_url
          done

  # Veröffentlicht den Entwurf, sobald Tests, alle Builds und das Arch-Paket erfolgreich waren.
  # Nur bei Tags; bei einem manuellen Lauf ohne Tag bleibt es ein Entwurf.
  publish:
    needs: [test, draft, build, arch]
    if: ${{ github.ref_type == 'tag' && needs.test.result == 'success' && needs.draft.result == 'success' && needs.build.result == 'success' && needs.arch.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH "repos/${{ github.repository }}/releases/${{ needs.draft.outputs.id }}" -F draft=false --jq .html_url
