[package]
name = "crabshell"
version = "0.1.0"
description = "A local OpenSSH terminal manager"
authors = ["Crabshell"]
edition = "2021"

[lib]
name = "crabshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2" }
