[package]
name = "crabshell"
version = "0.2.7"
description = "A local OpenSSH terminal manager"
authors = ["Crabshell"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alex-1987/Crabshell"

[lib]
name = "crabshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Smaller dev builds: line numbers for Crabshell itself, no debug info for dependencies.
# Cuts the size of target/debug considerably and speeds up linking.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
